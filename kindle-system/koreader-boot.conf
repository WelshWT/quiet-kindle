# Boot straight into KOReader (asked for on 19 Oct 2026: "make kindle boot straight into koreader").
# Installed in /etc/upstart by kindle-ui's bin/kboot; `bin/kboot off` removes it.
#
# Once per boot, after Amazon's home has finished starting (KOReader's launcher pauses it, and starting things
# before it's up left Amazon's side confused in testing), launch KOReader the way kpm does. Amazon's side stays
# one tap away (Kindle home on the pull-down sheet), and leaving KOReader for it never relaunches KOReader:
# this only runs at boot. If Amazon's home never comes up (a first-run or lock screen, a stuck framework) it
# leaves the Kindle alone rather than launching into a half-started system (review C1-10): KOReader is then one tap
# away in Amazon's library. The once-per-boot mark is set only when it launches, so a framework restart during
# boot still gets its launch.
#
# Escape hatch: a file named koreader-boot-off in the Kindle's top folder (create it over USB) skips this.

start on framework_ready
stop on stopping framework

task

script
    [ -f /mnt/us/koreader-boot-off ] && exit 0
    [ -f /tmp/koreader-boot.done ] && exit 0
    # every second for 2 minutes, then every 5 seconds up to about 17 minutes
    n=0
    until [ "$(lipc-get-prop com.lab126.appmgrd activeApp 2>/dev/null)" = "com.lab126.KPPMainApp" ]; do
        n=$((n + 1))
        [ $n -gt 300 ] && exit 0
        if [ $n -lt 120 ]; then sleep 1; else sleep 5; fi
    done
    sleep 3
    pgrep -f "reader[.]lua" >/dev/null 2>&1 && exit 0
    touch /tmp/koreader-boot.done
    PATH=/var/local/kmc/bin:/usr/sbin:/usr/bin:/sbin:/bin setsid nohup /var/local/kmc/bin/kpm launch koreader --asap </dev/null >/dev/null 2>&1 &
end script
